version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: traceguard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traceguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traceguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traceguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traceguard-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traceguard
      REDIS_URL: redis://redis:6379/0
      DEDUPLICATION_WINDOW_SECONDS: 300
      SLA_MINUTES_SEV1: 15
      SLA_MINUTES_SEV2: 60
      SLA_MINUTES_SEV3: 240
      VECTOR_DIMENSION: 768
      SECRET_KEY: production-secret-key-replace-with-vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
